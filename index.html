// ── RUMMY — Interactive 13-Card Engine ───────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════
function RummySetup({ onBack, onStart }) {
  const [d, setD] = useState(() => ({ ...newRummyGame(), players: ["", "", ""] }));
  const [n, setN] = useState(3);
  const setP = (i, v) => setD(g => { const p = [...g.players]; p[i] = v; return { ...g, players: p }; });
  const adjustN = num => { setN(num); setD(g => { const p = [...g.players]; while (p.length < num) p.push(""); return { ...g, players: p.slice(0, num) }; }); };
  const ok = d.players.slice(0, n).every(p => p.trim());
  return (
    <div style={{ padding: "48px 20px 40px" }}>
      <button onClick={onBack} style={BK}>← Back</button>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
        <span style={{ fontSize: 10, fontWeight: 700, color: "white", background: "#f15bb5", borderRadius: 8, padding: "3px 10px" }}>RUMMY</span>
        <h1 style={PT}>New Game</h1>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <Card><Lbl>Game Name <M>(optional)</M></Lbl><Inp value={d.name} placeholder="e.g. Family Rummy" onChange={v => setD(g => ({ ...g, name: v }))} /></Card>
        <Card>
          <Lbl>Players (2–6)</Lbl>
          <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            {[2, 3, 4, 5, 6].map(num => <button key={num} onClick={() => adjustN(num)} style={{ width: 36, height: 36, borderRadius: 10, border: n === num ? "2px solid #f15bb5" : "2px solid transparent", background: n === num ? "#fff0f8" : "#f2f2f2", color: n === num ? "#f15bb5" : "#555", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>{num}</button>)}
          </div>
          {Array.from({ length: n }).map((_, i) => <div key={i} style={{ marginBottom: i < n - 1 ? 9 : 0 }}><Inp bold value={d.players[i] || ""} placeholder={`Player ${i + 1}`} onChange={v => setP(i, v)} /></div>)}
        </Card>
        <Card>
          <Lbl>Elimination Score</Lbl>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            {[100,200,500].map(c=><button key={c} onClick={()=>setD(g=>({...g,targetScore:c}))} style={{flex:1,padding:"10px 4px",borderRadius:12,border:d.targetScore===c?"2px solid #f15bb5":"2px solid transparent",background:d.targetScore===c?"#fff0f8":"#f2f2f2",color:d.targetScore===c?"#f15bb5":"#555",fontWeight:700,fontSize:13,cursor:"pointer"}}>{c}</button>)}
          </div>
          <input type="number" min="50" placeholder="Custom score..." value={[100,200,500].includes(d.targetScore)?"":(d.targetScore||"")} onChange={e=>e.target.value&&setD(g=>({...g,targetScore:Number(e.target.value)}))} style={{width:"100%",padding:"9px 12px",borderRadius:10,border:"1.5px solid #fbcfe8",fontSize:14,outline:"none",boxSizing:"border-box"}}/>
        </Card>
        <Btn primary disabled={!ok} onClick={() => onStart({ ...d, players: d.players.slice(0, n), id: Date.now() })} style={{ background: "#f15bb5" }}>Start Game →</Btn>
      </div>
    </div>
  );
}

function RummyGame({ game, onSubmit, onHistory, onRules, onEnd, onHome, showToast, onShare, onDash, onEditPlayers, lang, setLang }) {
  const p = game.players;
  const COLORS = ["#4a7cfc", "#e63946", "#16a34a", "#f4a261", "#9b5de5", "#f15bb5"];
  const scores = p.map((_, i) => game.rounds.reduce((a, r) => a + (r.scores?.[i] || 0), 0));
  const rn = game.rounds.length + 1;
  const [winner, setWinner] = useState(0);
  const [dealer, setDealer] = useState(null);
  const [playerData, setPlayerData] = useState(p.map(() => ({ action: "play", cardPts: "" })));
  // actions: play | firstDrop | middleDrop | wrongDeclare

  const DROP_SCORES = { firstDrop: 20, middleDrop: 40, wrongDeclare: 80, play: null };
  const DROP_LABELS = { play: "Played", firstDrop: "First Drop (-20)", middleDrop: "Mid Drop (-40)", wrongDeclare: "Wrong Declare (-80)" };

  const setPlayerAction = (i, action) => setPlayerData(d => { const x = JSON.parse(JSON.stringify(d)); x[i].action = action; if (action !== "play") x[i].cardPts = ""; return x; });
  const setPlayerPts = (i, v) => setPlayerData(d => { const x = JSON.parse(JSON.stringify(d)); x[i].cardPts = v; return x; });

  const getScore = (i) => {
    if (i === winner) return 0;
    if (playerData[i].action !== "play") return DROP_SCORES[playerData[i].action];
    return Number(playerData[i].cardPts) || 0;
  };

  const canSubmit = p.every((_, i) => i === winner || playerData[i].action !== "play" || playerData[i].cardPts !== "");

  // Suggest: card points should be ≤ 80 (max possible = all face cards)
  const suggestPoints = (i) => {
    if (i === winner) return "0 (winner)";
    if (playerData[i].action !== "play") return DROP_SCORES[playerData[i].action] + " (auto)";
    const pts = Number(playerData[i].cardPts);
    if (!pts) return "Enter card points";
    if (pts > 80) return "⚠ Usually ≤ 80";
    return "✓ " + pts + " points";
  };

  const submit = () => {
    const roundScores = p.map((_, i) => getScore(i));
    onSubmit({ winner, winnerName: p[winner], scores: roundScores, drops: playerData.map(d => d.action), cardPts: playerData.map(d => Number(d.cardPts) || 0), ts: new Date().toISOString() });
    // Voice result
    const losers=p.filter((_,i)=>i!==winner);
    const spk=lang==="hi"
      ?p[winner]+" ne Rummy declare kiya! "+losers.map(l=>{const li=p.indexOf(l);return l+": "+roundScores[li]+" points";}).join(". ")+"."
      :p[winner]+" declares Rummy! "+losers.map(l=>{const li=p.indexOf(l);return l+" gets "+roundScores[li]+" points";}).join(". ")+".";
    speak(spk,lang||"en",null);
    setPlayerData(p.map(() => ({ action: "play", cardPts: "" })));
    setWinner(0);
  };

  const spkText = rummyScoreSpeech(game, lang || "en");

  return (
    <div>
      <div style={{ padding: "48px 20px 0", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ flex: 1 }}>
          <button onClick={onHome} style={BK}>← Games</button>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 2 }}>
            <span style={{ fontSize: 10, fontWeight: 700, color: "white", background: "#f15bb5", borderRadius: 6, padding: "2px 8px" }}>RUMMY</span>
            <h1 style={{ ...PT, fontSize: 18, margin: 0 }}>{game.name || p.join(" · ")}</h1>
          </div>
          <p style={{ margin: "2px 0 0", color: "#bbb", fontSize: 12 }}>Round {rn} · Eliminate at {game.targetScore} pts</p>
        </div>
        <div style={{ display: "flex", gap: 5, paddingTop: 28 }}>
          <Pill onClick={onEditPlayers}>✏️</Pill>
          <Pill onClick={onRules}>📖</Pill>
          <Pill onClick={onHistory}>History</Pill>
        </div>
      </div>

      {/* Score bars */}
      <div style={{ margin: "12px 20px 0", overflowX: "auto" }}>
        <div style={{ display: "flex", gap: 7, minWidth: "max-content" }}>
          {p.map((pl, i) => {
            const pct = Math.min((scores[i] / game.targetScore) * 100, 100);
            return (
              <div key={i} style={{ minWidth: 80, background: "white", borderRadius: 13, padding: "10px 7px", textAlign: "center", boxShadow: "0 2px 6px rgba(0,0,0,0.07)", border: scores[i] >= game.targetScore ? "2px solid #e63946" : "2px solid transparent" }}>
                <div style={{ fontSize: 9, color: COLORS[i % COLORS.length], fontWeight: 700, textTransform: "uppercase" }}>{pl}</div>
                <div style={{ fontSize: 22, fontWeight: 900, color: scores[i] >= game.targetScore ? "#e63946" : "#111" }}>{scores[i]}</div>
                <div style={{ height: 3, background: "#f0f0f0", borderRadius: 3, marginTop: 4, overflow: "hidden" }}>
                  <div style={{ width: pct + "%", height: "100%", background: scores[i] >= game.targetScore ? "#e63946" : "#f15bb5" }} />
                </div>
                {scores[i] >= game.targetScore && <div style={{ fontSize: 8, color: "#e63946", fontWeight: 700, marginTop: 2 }}>OUT</div>}
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ padding: "12px 20px 40px", display: "flex", flexDirection: "column", gap: 12 }}>

        {/* Winner */}
        <Card>
          <Lbl>🏆 Who declared Rummy?</Lbl>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {p.map((pl, i) => <button key={i} onClick={() => setWinner(i)} style={{ padding: "9px 14px", borderRadius: 20, fontSize: 13, fontWeight: 700, cursor: "pointer", background: winner === i ? "#f15bb5" : "#f2f2f2", color: winner === i ? "white" : "#444", border: winner === i ? "2px solid #f15bb5" : "2px solid transparent" }}>{pl}</button>)}
          </div>
        </Card>

        {/* Per-player scores */}
        <Card>
          <Lbl>Other Players — Action & Points</Lbl>
          <div style={{ background: "#fff0f8", borderRadius: 10, padding: "8px 12px", marginBottom: 12, fontSize: 12, color: "#be185d" }}>
            💡 <strong>Card values:</strong> A/K/Q/J/10 = 10 pts · Others = face value · Joker = 0
          </div>
          {p.map((pl, i) => i === winner ? (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: "#f0fff4", borderRadius: 12, marginBottom: 8 }}>
              <div style={{ width: 10, height: 10, borderRadius: "50%", background: COLORS[i % COLORS.length] }} />
              <div style={{ flex: 1, fontSize: 13, fontWeight: 700, color: COLORS[i % COLORS.length] }}>{pl}</div>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#16a34a" }}>🏆 Winner · 0 pts</div>
            </div>
          ) : (
            <div key={i} style={{ background: "#f9f9f9", borderRadius: 12, padding: "10px 12px", marginBottom: 8 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <div style={{ width: 10, height: 10, borderRadius: "50%", background: COLORS[i % COLORS.length], flexShrink: 0 }} />
                <div style={{ fontSize: 13, fontWeight: 700, color: COLORS[i % COLORS.length], flex: 1 }}>{pl}</div>
                <div style={{ fontSize: 11, color: playerData[i].action !== "play" ? "#e63946" : "#16a34a", fontWeight: 600 }}>{suggestPoints(i)}</div>
              </div>
              {/* Action selector */}
              <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: playerData[i].action === "play" ? 8 : 0 }}>
                {Object.entries(DROP_LABELS).map(([val, lbl]) => (
                  <button key={val} onClick={() => setPlayerAction(i, val)} style={{ padding: "6px 9px", borderRadius: 9, fontSize: 11, fontWeight: 600, cursor: "pointer", background: playerData[i].action === val ? "#f15bb5" : "#f2f2f2", color: playerData[i].action === val ? "white" : "#555", border: playerData[i].action === val ? "2px solid #f15bb5" : "2px solid transparent", flexShrink: 0 }}>{lbl}</button>
                ))}
              </div>
              {/* Card points input — only if played */}
              {playerData[i].action === "play" && (
                <div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 6 }}>
                    {[10, 20, 30, 40, 50, 60, 70, 80].map(n => (
                      <button key={n} onClick={() => setPlayerPts(i, String(n))} style={{ width: 36, height: 32, borderRadius: 8, fontSize: 12, fontWeight: playerData[i].cardPts === String(n) ? 800 : 500, background: playerData[i].cardPts === String(n) ? COLORS[i % COLORS.length] : "#f2f2f2", color: playerData[i].cardPts === String(n) ? "white" : "#555", border: playerData[i].cardPts === String(n) ? "2px solid " + COLORS[i % COLORS.length] : "2px solid transparent", cursor: "pointer" }}>{n}</button>
                    ))}
                  </div>
                  <input type="number" min="0" max="80" value={playerData[i].cardPts} onChange={e => setPlayerPts(i, e.target.value)} placeholder="Or enter exact points (0–80)"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: 9, border: "1.5px solid #fbcfe8", fontSize: 13, outline: "none", boxSizing: "border-box" }} />
                </div>
              )}
            </div>
          ))}
        </Card>

        {/* Round preview */}
        {canSubmit && (
          <Card style={{ background: "#fff0f8", border: "1.5px solid #fbcfe8" }}>
            <Lbl>Round {rn} Preview</Lbl>
            <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
              {p.map((pl, i) => (
                <div key={i} style={{ flex: 1, minWidth: 60, background: "white", borderRadius: 10, padding: "7px 6px", textAlign: "center" }}>
                  <div style={{ fontSize: 10, color: COLORS[i % COLORS.length], fontWeight: 700 }}>{pl}</div>
                  <div style={{ fontSize: 16, fontWeight: 800, color: getScore(i) === 0 ? "#16a34a" : "#e63946" }}>+{getScore(i)}</div>
                  <div style={{ fontSize: 10, color: "#aaa" }}>→ {scores[i] + getScore(i)}</div>
                </div>
              ))}
            </div>
          </Card>
        )}

        <ShufflerCard players={p} value={dealer} onChange={setDealer} lang={lang}/>
        <Btn primary disabled={!canSubmit} onClick={submit} style={{ background: "#f15bb5" }}>Record Round {rn}</Btn>
        <div style={{ display: "flex", gap: 8 }}>
          <SpeakBtn text={spkText} lang={lang || "en"} size={46} />
          <button onClick={() => setLang && setLang(lang === "en" ? "hi" : "en")} style={{ width: 46, height: 46, background: "#f2f2f2", border: "none", borderRadius: 13, cursor: "pointer", fontSize: 10, fontWeight: 700, color: "#555" }}>{lang === "en" ? "हिंदी" : "ENG"}</button>
          <button onClick={onShare} style={{ ...SB, flex: 1 }}>📤 Share</button>
          <button onClick={onDash} style={{ ...SB, flex: 1 }}>📊 Stats</button>
        </div>
        <button onClick={() => { if (window.confirm("End game?")) onEnd(); }} style={{ ...SB, width: "100%" }}>🏁 End Game</button>
      </div>
    </div>
  );
}

function RummyHistory({ game, onBack }) {
  const p = game.players;
  const COLORS = ["#4a7cfc", "#e63946", "#16a34a", "#f4a261", "#9b5de5", "#f15bb5"];
  let cum = p.map(() => 0);
  const rows = game.rounds.map(r => { if (r.scores) cum = cum.map((c, i) => c + r.scores[i]); return { r, cum: [...cum] }; });
  return (
    <div style={{ padding: "48px 20px 40px" }}>
      <button onClick={onBack} style={BK}>← Back</button>
      <h1 style={PT}>Round History</h1>
      <p style={{ margin: "2px 0 14px", color: "#999", fontSize: 13 }}>{game.rounds.length} rounds · eliminate at {game.targetScore} pts</p>
      {[...rows].reverse().map(({ r, cum }, i) => {
        const ri = game.rounds.length - i;
        return (
          <div key={i} style={{ background: "#f7f7f7", borderRadius: 14, padding: "12px 14px", marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ fontSize: 11, color: "#999", fontWeight: 600 }}>Rd {ri}</span>
              <span style={{ fontSize: 11, color: "#f15bb5", fontWeight: 700 }}>🏆 {r.winnerName}</span>
              {r.ts && <span style={{ fontSize: 10, color: "#ccc" }}>{fmt(r.ts)}</span>}
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {p.map((pl, j) => (
                <div key={j} style={{ background: "white", borderRadius: 9, padding: "6px 9px", textAlign: "center", minWidth: 58 }}>
                  <div style={{ fontSize: 9, color: COLORS[j % COLORS.length], fontWeight: 700 }}>{pl}</div>
                  <div style={{ fontSize: 11, color: "#888", marginBottom: 1 }}>{r.drops?.[j] !== "play" ? r.drops?.[j] || "" : ""}</div>
                  <div style={{ fontSize: 13, fontWeight: 800, color: r.scores?.[j] === 0 ? "#16a34a" : "#e63946" }}>+{r.scores?.[j] ?? 0}</div>
                  <div style={{ fontSize: 10, color: cum[j] >= game.targetScore ? "#e63946" : "#aaa" }}>∑{cum[j]}</div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function RummyRules({ onBack }) {
  return (
    <div style={{ padding: "48px 20px 40px" }}>
      <button onClick={onBack} style={BK}>← Back</button>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
        <span style={{ fontSize: 22 }}>🃏</span><h1 style={{ ...PT, color: "#f15bb5" }}>Rummy Rules</h1>
      </div>
      <div style={{ background: "#fff0f8", border: "1px solid #fbcfe8", borderRadius: 14, padding: "11px 14px", marginBottom: 16, fontSize: 13, color: "#be185d", lineHeight: 1.6 }}>
        <strong>Indian Rummy (13-card).</strong> 2–6 players, 2 decks + 2 jokers. Arrange 13 cards into valid sequences and sets. Must have at least one pure sequence to declare.
      </div>
      <div style={{ fontWeight: 800, fontSize: 14, color: "#f15bb5", marginBottom: 10 }}>🃏 Valid Combinations</div>
      <HandVisual title="Pure Sequence ✅ Required" cards={["7♠", "8♠", "9♠"]} color="#e63946" desc="3+ consecutive same-suit cards, NO joker. Every winning hand must have at least one." />
      <HandVisual title="Impure Sequence" cards={["4♥", "🃏", "6♥"]} color="#f15bb5" desc="3+ consecutive cards with joker replacing a missing card." />
      <HandVisual title="Set / Group" cards={["K♠", "K♥", "K♦"]} color="#9b5de5" desc="3–4 cards of same rank, different suits. Joker can substitute." />
      <HandVisual title="Joker" cards={["🃏"]} color="#f4a261" desc="Printed joker OR wild card. Replaces any card in impure sequences or sets." />
      <Card style={{ marginTop: 8 }}>
        <div style={{ fontWeight: 800, fontSize: 14, color: "#f15bb5", marginBottom: 8 }}>🏆 Scoring</div>
        {[["Winner", "0 points", "#16a34a"],
          ["Unmatched A/K/Q/J/10", "10 pts each", "#e63946"],
          ["Unmatched number cards", "Face value", "#f4a261"],
          ["Joker", "0 pts", "#888"],
          ["First Drop (before 1st draw)", "20 pts penalty", "#e63946"],
          ["Middle Drop", "40 pts penalty", "#e63946"],
          ["Wrong Declare", "80 pts penalty", "#e63946"],
        ].map(([lbl, val, c]) => (
          <div key={lbl} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #f0f0f0" }}>
            <span style={{ fontSize: 12, color: "#555" }}>{lbl}</span>
            <span style={{ fontSize: 12, fontWeight: 700, color: c }}>{val}</span>
          </div>
        ))}
      </Card>
    </div>
  );
}

function Import({onBack,onImport}){
  const[raw,setRaw]=useState(""),[err,setErr]=useState("");
  const go=()=>{
    setErr("");
    try{
      const p=JSON.parse(raw.trim());
      if(!Array.isArray(p)){setErr("Must be a JSON array.");return}
      if(!p.every(g=>g.id&&Array.isArray(g.rounds))){setErr("Invalid format.");return}
      // Auto-detect type for old games that don't have a type field
      const fixed=p.map(g=>{
        if(g.type)return g;
        // Old CP games have teams array; old TTF games have players array of length 3
        if(g.teams&&Array.isArray(g.teams))return{...g,type:"cp"};
        if(g.players&&Array.isArray(g.players)&&g.players.length===3)return{...g,type:"ttf"};
        return{...g,type:"cp"}; // default fallback
      });
      onImport(fixed);
    }catch(e){setErr("Cannot parse. Paste the full export text. Error: "+e.message)}
  };
  return(
    <div style={{padding:"48px 20px 40px"}}>
      <button onClick={onBack} style={BK}>← Back</button>
      <h1 style={PT}>Import Games</h1>
      <div style={{background:"#fff8e1",border:"1px solid #ffc107",borderRadius:14,padding:"12px 14px",margin:"16px 0",fontSize:13,color:"#856404",lineHeight:1.6}}>
        1. Open old app → tap <strong>📤 Export</strong><br/>2. Data copies to clipboard<br/>3. Paste below → tap Import
      </div>
      <textarea value={raw} onChange={e=>{setRaw(e.target.value);setErr("")}} placeholder="Paste exported game data here…" style={{width:"100%",minHeight:160,background:"#f7f7f7",border:"1.5px solid #e8e8e8",borderRadius:14,padding:"12px 14px",fontSize:13,fontFamily:"monospace",boxSizing:"border-box",outline:"none",resize:"vertical"}}/>
      {err&&<div style={{color:"#e63946",fontSize:13,marginTop:8}}>⚠ {err}</div>}
      <div style={{marginTop:13}}><Btn primary disabled={!raw.trim()} onClick={go}>Import Games</Btn></div>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
