function RummyGame({ game, onSubmit, onHistory, onRules, onEnd, onHome, showToast }) {
  const p = game.players;
  const COLORS = ["#4a7cfc", "#e63946", "#16a34a", "#f4a261", "#9b5de5", "#f15bb5"];
  const scores = p.map((_, i) => game.rounds.reduce((a, r) => a + (r.scores?.[i] || 0), 0));
  const [winner, setWinner] = useState(0);
  const [pts, setPts] = useState(p.map(() => ""));
  const [isDrop, setIsDrop] = useState(p.map(() => "none")); // "none" | "first" | "middle" | "wrong"
  const rn = game.rounds.length + 1;

  const dropPenalty = { none: null, first: 20, middle: 40, wrong: 80 };

  const getScore = (i) => {
    if (i === winner) return 0;
    if (isDrop[i] !== "none") return dropPenalty[isDrop[i]];
    return Number(pts[i]) || 0;
  };

  const canSubmit = p.every((_, i) => i === winner || isDrop[i] !== "none" || pts[i] !== "");

  const submit = () => {
    const roundScores = p.map((_, i) => getScore(i));
    onSubmit({ winner, winnerName: p[winner], scores: roundScores, drops: [...isDrop], ts: new Date().toISOString() });
    setPts(p.map(() => "")); setWinner(0); setIsDrop(p.map(() => "none"));
  };

  return (
    <div>
      <div style={{ padding: "48px 20px 0", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ flex: 1 }}>
          <button onClick={onHome} style={BK}>← Games</button>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 2 }}>
            <span style={{ fontSize: 10, fontWeight: 700, color: "white", background: "#f15bb5", borderRadius: 6, padding: "2px 8px" }}>RUMMY</span>
            <h1 style={{ ...PT, fontSize: 18, margin: 0 }}>{game.name || p.join(" · ")}</h1>
          </div>
          <p style={{ margin: "2px 0 0", color: "#bbb", fontSize: 12 }}>Round {rn} · Eliminate at {game.targetScore} pts</p>
        </div>
        <div style={{ display: "flex", gap: 6, paddingTop: 28 }}>
          <Pill onClick={onRules}>📖 Rules</Pill>
          <Pill onClick={onHistory}>History</Pill>
        </div>
      </div>
      <div style={{ margin: "13px 20px 0", overflowX: "auto" }}>
        <div style={{ display: "flex", gap: 8, minWidth: "max-content" }}>
          {p.map((pl, i) => {
            const sc = scores[i];
            const pct = Math.min((sc / game.targetScore) * 100, 100);
            return (
              <div key={i} style={{ minWidth: 85, background: "white", borderRadius: 13, padding: "11px 8px", textAlign: "center", boxShadow: "0 2px 8px rgba(0,0,0,0.06)", border: sc >= game.targetScore ? "2px solid #e63946" : "2px solid transparent" }}>
                <div style={{ fontSize: 10, color: COLORS[i % COLORS.length], fontWeight: 700, textTransform: "uppercase", marginBottom: 2 }}>{pl}</div>
                <div style={{ fontSize: 24, fontWeight: 900, color: sc >= game.targetScore ? "#e63946" : "#111", lineHeight: 1 }}>{sc}</div>
                <div style={{ height: 4, background: "#f0f0f0", borderRadius: 4, marginTop: 4, overflow: "hidden" }}>
                  <div style={{ width: pct + "%", height: "100%", background: sc >= game.targetScore ? "#e63946" : "#f15bb5", transition: "width 0.4s" }} />
                </div>
                {sc >= game.targetScore && <div style={{ fontSize: 9, color: "#e63946", fontWeight: 700, marginTop: 2 }}>OUT</div>}
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ padding: "13px 20px 40px", display: "flex", flexDirection: "column", gap: 13 }}>
        <Card>
          <Lbl>Winner (declared Rummy)</Lbl>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {p.map((pl, i) => <button key={i} onClick={() => setWinner(i)} style={{ padding: "9px 14px", borderRadius: 20, fontSize: 13, fontWeight: 700, cursor: "pointer", background: winner === i ? "#f15bb5" : "#f2f2f2", color: winner === i ? "white" : "#444", border: winner === i ? "2px solid #f15bb5" : "2px solid transparent" }}>{pl}</button>)}
          </div>
        </Card>
        <Card>
          <Lbl>Points / Drops for Other Players</Lbl>
          {p.map((pl, i) => i === winner ? null : (
            <div key={i} style={{ marginBottom: 12, background: "#f9f9f9", borderRadius: 12, padding: "10px 12px" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: COLORS[i % COLORS.length], marginBottom: 8 }}>{pl}</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: isDrop[i] === "none" ? 8 : 0 }}>
                {[["none", "Points"], ["first", "Drop (20)"], ["middle", "Mid Drop (40)"], ["wrong", "Wrong (80)"]].map(([val, lbl]) => (
                  <button key={val} onClick={() => { const x = [...isDrop]; x[i] = val; setIsDrop(x); }} style={{ padding: "7px 10px", borderRadius: 10, fontSize: 12, fontWeight: 600, cursor: "pointer", background: isDrop[i] === val ? "#f15bb5" : "#f2f2f2", color: isDrop[i] === val ? "white" : "#555", border: isDrop[i] === val ? "2px solid #f15bb5" : "2px solid transparent" }}>{lbl}</button>
                ))}
              </div>
              {isDrop[i] === "none" && (
                <input type="number" min="0" value={pts[i]} onChange={e => { const x = [...pts]; x[i] = e.target.value; setPts(x); }}
                  placeholder="Card points" style={{ width: "100%", padding: "9px 12px", borderRadius: 10, border: "1.5px solid #e8e8e8", fontSize: 15, fontWeight: 700, outline: "none", textAlign: "center" }} />
              )}
            </div>
          ))}
        </Card>
        <Btn primary disabled={!canSubmit} onClick={submit} style={{ background: "#f15bb5" }}>Record Round {rn}</Btn>
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={() => { if (window.confirm("End game?")) onEnd(); }} style={SB}>🏁 End</button>
        </div>
      </div>
    </div>
  );
}

function RummyHistory({ game, onBack }) {
  const p = game.players;
  const COLORS = ["#4a7cfc", "#e63946", "#16a34a", "#f4a261", "#9b5de5", "#f15bb5"];
  let cum = p.map(() => 0);
  const rows = game.rounds.map(r => { if (r.scores) cum = cum.map((c, i) => c + r.scores[i]); return { r, cum: [...cum] }; });
  return (
    <div style={{ padding: "48px 20px 40px" }}>
      <button onClick={onBack} style={BK}>← Back</button>
      <h1 style={PT}>Round History</h1>
      <p style={{ margin: "2px 0 14px", color: "#999", fontSize: 13 }}>{game.rounds.length} rounds</p>
      {[...rows].reverse().map(({ r, cum }, i) => {
        const ri = game.rounds.length - i;
        return (
          <div key={i} style={{ background: "#f7f7f7", borderRadius: 14, padding: "12px 14px", marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ fontSize: 11, color: "#999", fontWeight: 600 }}>Rd {ri}</span>
              <span style={{ fontSize: 11, color: "#f15bb5", fontWeight: 700 }}>🏆 {r.winnerName}</span>
              {r.ts && <span style={{ fontSize: 10, color: "#ccc" }}>{fmt(r.ts)}</span>}
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {p.map((pl, j) => (
                <div key={j} style={{ background: "white", borderRadius: 9, padding: "6px 10px", textAlign: "center", minWidth: 60 }}>
                  <div style={{ fontSize: 10, color: COLORS[j % COLORS.length], fontWeight: 700 }}>{pl}</div>
                  <div style={{ fontSize: 13, fontWeight: 800, color: r.scores?.[j] === 0 ? "#16a34a" : "#e63946" }}>+{r.scores?.[j] ?? 0}</div>
                  <div style={{ fontSize: 10, color: cum[j] >= game.targetScore ? "#e63946" : "#aaa" }}>∑{cum[j]}</div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}
function Import({onBack,onImport}){
  const[raw,setRaw]=useState(""),[err,setErr]=useState("");
  const go=()=>{
    setErr("");
    try{
      const p=JSON.parse(raw.trim());
      if(!Array.isArray(p)){setErr("Must be a JSON array.");return}
      if(!p.every(g=>g.id&&Array.isArray(g.rounds))){setErr("Invalid format.");return}
      // Auto-detect type for old games that don't have a type field
      const fixed=p.map(g=>{
        if(g.type)return g;
        // Old CP games have teams array; old TTF games have players array of length 3
        if(g.teams&&Array.isArray(g.teams))return{...g,type:"cp"};
        if(g.players&&Array.isArray(g.players)&&g.players.length===3)return{...g,type:"ttf"};
        return{...g,type:"cp"}; // default fallback
      });
      onImport(fixed);
    }catch(e){setErr("Cannot parse. Paste the full export text. Error: "+e.message)}
  };
  return(
    <div style={{padding:"48px 20px 40px"}}>
      <button onClick={onBack} style={BK}>← Back</button>
      <h1 style={PT}>Import Games</h1>
      <div style={{background:"#fff8e1",border:"1px solid #ffc107",borderRadius:14,padding:"12px 14px",margin:"16px 0",fontSize:13,color:"#856404",lineHeight:1.6}}>
        1. Open old app → tap <strong>📤 Export</strong><br/>2. Data copies to clipboard<br/>3. Paste below → tap Import
      </div>
      <textarea value={raw} onChange={e=>{setRaw(e.target.value);setErr("")}} placeholder="Paste exported game data here…" style={{width:"100%",minHeight:160,background:"#f7f7f7",border:"1.5px solid #e8e8e8",borderRadius:14,padding:"12px 14px",fontSize:13,fontFamily:"monospace",boxSizing:"border-box",outline:"none",resize:"vertical"}}/>
      {err&&<div style={{color:"#e63946",fontSize:13,marginTop:8}}>⚠ {err}</div>}
      <div style={{marginTop:13}}><Btn primary disabled={!raw.trim()} onClick={go}>Import Games</Btn></div>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
